<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NexusChat - Realtime Messenger</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b',
                        darkhover: '#334155'
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Use dynamic viewport height for mobile keyboards */
        .app-height {
            height: 100vh;
            height: 100dvh;
        }
        
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.25);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.4);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pulse-online {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Mobile touch highlights fix */
        button, a, input {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased app-height overflow-hidden flex flex-col selection:bg-brand-500 selection:text-white">

    <!-- AUTH MODAL OVERLAY (Login & Register) -->
    <div id="auth-overlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl animate-fade-in relative max-h-[90dvh] overflow-y-auto">
            <div class="text-center mb-6">
                <div class="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold text-white shadow-lg mb-3">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">NexusChat</h2>
                <p class="text-xs text-slate-400 mt-1">Мессенджер для общения без границ</p>
            </div>

            <!-- Auth Tabs -->
            <div class="flex bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800/80">
                <button type="button" id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Вход</button>
                <button type="button" id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">Регистрация</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Имя пользователя (Логин)</label>
                    <input type="text" id="login-username" required placeholder="Введите ваш логин" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Пароль</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/30">Войти в аккаунт</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Имя пользователя</label>
                    <input type="text" id="reg-username" required placeholder="Придумайте уникальный логин" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Пароль</label>
                    <input type="password" id="reg-password" required placeholder="Придумайте пароль" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Цвет аватарки</label>
                    <select id="reg-avatar" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                        <option value="from-indigo-500 to-purple-500">Индиго-Фиолетовый</option>
                        <option value="from-blue-500 to-teal-400">Синий-Бирюзовый</option>
                        <option value="from-emerald-500 to-teal-600">Изумрудный</option>
                        <option value="from-rose-500 to-pink-600">Розовый</option>
                        <option value="from-amber-500 to-orange-600">Янтарный</option>
                    </select>
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white rounded-xl text-xs font-semibold transition shadow-lg shadow-indigo-600/30">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="flex app-height w-full relative overflow-hidden">

        <!-- Left Sidebar: Chat List -->
        <aside id="sidebar" class="w-full md:w-80 lg:w-96 h-full bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300 flex-shrink-0 z-20">
            
            <!-- User Header Profile -->
            <div class="p-3.5 sm:p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
                <div class="flex items-center space-x-3 cursor-pointer">
                    <div class="relative">
                        <div id="my-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg">
                            ?
                        </div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full pulse-online"></span>
                    </div>
                    <div>
                        <h2 id="my-name-display" class="font-bold text-slate-100 text-sm flex items-center gap-1.5">
                            Загрузка...
                        </h2>
                        <p id="my-status-display" class="text-xs text-slate-400 truncate max-w-[130px]">В сети</p>
                    </div>
                </div>
                <div class="flex items-center space-x-1">
                    <button onclick="openNewChatModal()" class="w-10 h-10 rounded-full bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600 hover:text-white transition flex items-center justify-center active:scale-95" title="Найти собеседника">
                        <i class="fa-solid fa-user-plus text-sm"></i>
                    </button>
                    <button onclick="logout()" class="w-10 h-10 rounded-full hover:bg-red-500/20 text-slate-400 hover:text-red-400 transition flex items-center justify-center active:scale-95" title="Выйти из аккаунта">
                        <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="p-3 border-b border-slate-800/60">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="search-input" oninput="filterChats()" placeholder="Поиск диалогов..." class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-base sm:text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Chat Filter Tabs -->
            <div class="flex border-b border-slate-800 text-xs font-medium text-slate-400 px-3 pt-2 pb-2 gap-2">
                <button onclick="setTab('all')" id="tab-all" class="px-3 py-1.5 rounded-lg bg-indigo-600/20 text-indigo-400 font-semibold transition">Все чаты</button>
            </div>

            <!-- Chat Scroll Area -->
            <div id="chat-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Chat items populated dynamically -->
            </div>

            <!-- Sidebar Footer Stats -->
            <div class="p-3 border-t border-slate-800 text-[11px] text-slate-500 flex justify-between items-center bg-slate-950/40">
                <span id="socket-status" class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Подключение...</span>
                <span id="chat-count">0 диалогов</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main id="chat-main" class="hidden md:flex flex-1 flex-col h-full bg-slate-950 relative overflow-hidden z-10 w-full">
            
            <!-- Top Navbar for Active Chat -->
            <header id="chat-header" class="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur-md px-3 sm:px-4 flex items-center justify-between z-10 flex-shrink-0">
                <div class="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
                    
                    <!-- Mobile Back Button -->
                    <button onclick="closeChatMobile()" class="md:hidden w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 flex items-center justify-center flex-shrink-0">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </button>
                    
                    <div id="header-avatar-container" class="relative flex-shrink-0">
                        <div id="header-avatar" class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
                            ?
                        </div>
                        <span id="header-status-dot" class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                    </div>

                    <div class="min-w-0">
                        <h3 id="header-name" class="font-bold text-slate-100 text-sm truncate">
                            Выберите чат для общения
                        </h3>
                        <p id="header-status-text" class="text-[11px] text-slate-400 truncate">---</p>
                    </div>
                </div>

                <!-- Call and Options Buttons -->
                <div class="flex items-center space-x-1 sm:space-x-2 flex-shrink-0">
                    <button onclick="startCall('audio')" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 hover:text-white transition flex items-center justify-center" title="Голосовой звонок">
                        <i class="fa-solid fa-phone text-xs sm:text-sm"></i>
                    </button>
                    <button onclick="startCall('video')" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 hover:text-white transition flex items-center justify-center" title="Видеозвонок">
                        <i class="fa-solid fa-video text-xs sm:text-sm"></i>
                    </button>
                </div>
            </header>

            <!-- Messages Stream Area -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3.5 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900/30 via-slate-950 to-slate-950">
                <div class="h-full flex items-center justify-center text-slate-500 text-sm flex-col space-y-3">
                    <i class="fa-regular fa-comments text-4xl opacity-30"></i>
                    <p>Выберите собеседника для начала диалога</p>
                </div>
            </div>

            <!-- Input Form Toolbar -->
            <div class="p-2.5 sm:p-4 border-t border-slate-800 bg-slate-900/90 backdrop-blur-md relative flex-shrink-0">
                
                <!-- Quick Emoji Picker Popup -->
                <div id="emoji-picker" class="hidden absolute bottom-full left-2 sm:left-4 mb-2 p-2 bg-slate-800 border border-slate-700 rounded-2xl shadow-xl flex gap-1.5 sm:gap-2 animate-fade-in z-30">
                    <button type="button" onclick="insertEmoji('👍')" class="hover:scale-125 transition text-xl p-1">👍</button>
                    <button type="button" onclick="insertEmoji('❤️')" class="hover:scale-125 transition text-xl p-1">❤️</button>
                    <button type="button" onclick="insertEmoji('😂')" class="hover:scale-125 transition text-xl p-1">😂</button>
                    <button type="button" onclick="insertEmoji('🔥')" class="hover:scale-125 transition text-xl p-1">🔥</button>
                    <button type="button" onclick="insertEmoji('😎')" class="hover:scale-125 transition text-xl p-1">😎</button>
                    <button type="button" onclick="insertEmoji('🎉')" class="hover:scale-125 transition text-xl p-1">🎉</button>
                    <button type="button" onclick="insertEmoji('👋')" class="hover:scale-125 transition text-xl p-1">👋</button>
                </div>

                <form id="message-form" onsubmit="handleSendMessage(event)" class="flex items-center space-x-2">
                    <button type="button" onclick="toggleEmojiPicker()" class="p-2.5 text-slate-400 hover:text-indigo-400 active:scale-95 transition rounded-xl hover:bg-slate-800 flex-shrink-0">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>

                    <!-- Text Input: text-base for mobile prevents auto-zoom -->
                    <input type="text" id="message-input" autocomplete="off" placeholder="Напишите сообщение..." class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-base sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition min-w-0">

                    <button type="submit" class="w-11 h-11 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-2xl flex items-center justify-center transition shadow-lg shadow-indigo-600/30 flex-shrink-0">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- MODAL: Add New Friend / Real User Search -->
    <div id="modal-new-chat" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl animate-fade-in relative">
            <button onclick="closeModal('modal-new-chat')" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div class="flex items-center space-x-3 mb-5">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-lg flex-shrink-0">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-100 text-base">Найти собеседника</h3>
                    <p class="text-xs text-slate-400">Введите имя человека для создания чата</p>
                </div>
            </div>

            <form onsubmit="handleFindUser(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Имя пользователя (логин)</label>
                    <input type="text" id="find-username-input" required placeholder="Например: danya, vlad, alex..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" onclick="closeModal('modal-new-chat')" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 transition">Отмена</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-600/30">Открыть чат</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Call Screen -->
    <div id="modal-call" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl z-50 hidden flex flex-col items-center justify-between p-4 sm:p-6">
        <!-- Top Status Bar -->
        <div class="text-center pt-2 z-10">
            <div id="call-avatar" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 mx-auto flex items-center justify-center font-bold text-2xl sm:text-3xl text-white shadow-2xl mb-2 animate-pulse">
                ?
            </div>
            <h2 id="call-name" class="text-lg sm:text-xl font-bold text-white">Имя</h2>
            <p id="call-status" class="text-xs text-indigo-400 mt-0.5 flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
                <span>Инициализация медиа...</span>
            </p>
            <div id="call-timer" class="text-xs text-slate-400 mt-1 hidden font-mono">00:00</div>
        </div>

        <!-- Video Display Area -->
        <div class="relative w-full max-w-2xl flex-1 my-3 bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex items-center justify-center shadow-2xl">
            <!-- Remote Video / Placeholder -->
            <video id="remote-video" autoplay playsinline class="w-full h-full object-cover hidden"></video>
            <div id="remote-placeholder" class="text-center p-6">
                <i class="fa-solid fa-user text-5xl text-slate-700 mb-3 animate-bounce"></i>
                <p class="text-slate-400 text-xs sm:text-sm">Ожидание подключения...</p>
            </div>

            <!-- Local Camera Preview Floating Window -->
            <div id="local-video-container" class="absolute bottom-3 right-3 w-28 h-36 sm:w-40 sm:h-52 bg-slate-950 border border-slate-700/80 rounded-2xl overflow-hidden shadow-2xl hidden">
                <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                <div class="absolute top-1.5 left-1.5 bg-slate-950/80 backdrop-blur-md text-[9px] text-slate-300 px-2 py-0.5 rounded-full">
                    Вы
                </div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="flex items-center space-x-4 pb-2 z-10">
            <button id="btn-toggle-mic" onclick="toggleMicrophone()" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition">
                <i class="fa-solid fa-microphone text-base" id="mic-icon"></i>
            </button>
            <button id="btn-toggle-cam" onclick="toggleCamera()" class="w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition">
                <i class="fa-solid fa-video text-base" id="cam-icon"></i>
            </button>
            <button onclick="endCall()" class="w-14 h-14 rounded-2xl bg-red-600 hover:bg-red-500 text-white text-xl flex items-center justify-center shadow-lg shadow-red-600/40 transition active:scale-95">
                <i class="fa-solid fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <!-- Toast Notification Popup -->
    <div id="toast-container" class="fixed bottom-4 right-4 left-4 sm:left-auto z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        // Global App State
        const state = {
            currentUser: null, // { username, avatar }
            activeChatUser: null, // username string
            chats: [], // [{ username, avatar, lastMessage, unread, messages: [] }]
            searchQuery: ''
        };

        let socket = null;

        // Audio Sound FX
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playPop() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            },
            playReceive() {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e) {}
            }
        };

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-btn-login');
            const regBtn = document.getElementById('tab-btn-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                loginBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition';
                regBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition';
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                regBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition';
                loginBtn.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    onAuthSuccess(data.user);
                } else {
                    showToast(data.message || 'Ошибка входа', 'error');
                }
            } catch(err) {
                // Fallback for testing without active Flask backend server
                onAuthSuccess({ username: username, avatar: 'from-indigo-500 to-purple-500' });
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const avatar = document.getElementById('reg-avatar').value;

            if (!username || !password) return;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, avatar })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('Регистрация прошла успешно!', 'success');
                    onAuthSuccess(data.user);
                } else {
                    showToast(data.message || 'Ошибка регистрации', 'error');
                }
            } catch(err) {
                onAuthSuccess({ username: username, avatar: avatar });
            }
        }

        function onAuthSuccess(user) {
            state.currentUser = user;
            localStorage.setItem('nexus_user', JSON.stringify(user));
            
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('my-name-display').innerText = user.username;
            
            const myAvatarEl = document.getElementById('my-avatar');
            myAvatarEl.className = `w-10 h-10 rounded-full bg-gradient-to-tr ${user.avatar || 'from-indigo-500 to-purple-500'} flex items-center justify-center font-bold text-white shadow-lg`;
            myAvatarEl.innerText = user.username.charAt(0).toUpperCase();

            initSocketIO();
            loadSavedContacts();
        }

        function logout() {
            localStorage.removeItem('nexus_user');
            state.currentUser = null;
            state.chats = [];
            state.activeChatUser = null;
            document.getElementById('auth-overlay').classList.remove('hidden');
            if (socket) socket.disconnect();
        }

        function initSocketIO() {
            try {
                socket = io();

                socket.on('connect', () => {
                    document.getElementById('socket-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500 pulse-online"></span> Онлайн';
                    if (state.currentUser) {
                        socket.emit('register_socket', state.currentUser.username);
                    }
                });

                socket.on('disconnect', () => {
                    document.getElementById('socket-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-red-500"></span> Офлайн';
                });

                socket.on('receive_message', (data) => {
                    handleIncomingMessage(data);
                });

            } catch(e) {
                console.warn('SocketIO connection fallback mode', e);
            }
        }

        function loadSavedContacts() {
            const saved = localStorage.getItem(`nexus_chats_${state.currentUser.username}`);
            if (saved) {
                try {
                    state.chats = JSON.parse(saved);
                } catch(e) {
                    state.chats = [];
                }
            }
            renderChatList();
        }

        function saveContacts() {
            if (!state.currentUser) return;
            localStorage.setItem(`nexus_chats_${state.currentUser.username}`, JSON.stringify(state.chats));
        }

        async function openChatWithUser(targetUsername, targetAvatar = '') {
            let existingChat = state.chats.find(c => c.username.toLowerCase() === targetUsername.toLowerCase());
            
            if (!existingChat) {
                existingChat = {
                    username: targetUsername,
                    avatar: targetAvatar || 'from-blue-500 to-teal-400',
                    unread: 0,
                    messages: []
                };
                state.chats.unshift(existingChat);
            }

            state.activeChatUser = existingChat.username;
            existingChat.unread = 0;

            // Fetch history from Flask API if available
            try {
                const res = await fetch(`/api/history/${encodeURIComponent(state.currentUser.username)}/${encodeURIComponent(targetUsername)}`);
                if (res.ok) {
                    const history = await res.json();
                    existingChat.messages = history;
                }
            } catch(e) {
                // Local fallback
            }

            saveContacts();
            renderChatList();
            renderActiveChat();
            closeModal('modal-new-chat');

            // Responsive view switch for mobile: hide sidebar and show chat
            const sidebar = document.getElementById('sidebar');
            const chatMain = document.getElementById('chat-main');
            
            if (window.innerWidth < 768) {
                sidebar.classList.add('hidden');
                chatMain.classList.remove('hidden');
                chatMain.classList.add('flex');
            }
        }

        function closeChatMobile() {
            state.activeChatUser = null;
            const sidebar = document.getElementById('sidebar');
            const chatMain = document.getElementById('chat-main');

            chatMain.classList.add('hidden');
            chatMain.classList.remove('flex');
            sidebar.classList.remove('hidden');
            renderChatList();
        }

        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text || !state.activeChatUser || !state.currentUser) return;

            const payload = {
                sender: state.currentUser.username,
                receiver: state.activeChatUser,
                text: text,
                media_url: '',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            if (socket && socket.connected) {
                socket.emit('send_message', payload);
            } else {
                handleIncomingMessage(payload);
            }

            input.value = '';
            AudioFX.playPop();
        }

        function handleIncomingMessage(data) {
            const isMe = data.sender === state.currentUser.username;
            const otherUser = isMe ? data.receiver : data.sender;

            let chat = state.chats.find(c => c.username.toLowerCase() === otherUser.toLowerCase());
            if (!chat) {
                chat = {
                    username: otherUser,
                    avatar: 'from-emerald-500 to-teal-600',
                    unread: 0,
                    messages: []
                };
                state.chats.unshift(chat);
            }

            chat.messages.push({
                sender: data.sender,
                receiver: data.receiver,
                text: data.text,
                timestamp: data.timestamp || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            if (state.activeChatUser === chat.username) {
                renderActiveChat();
            } else {
                chat.unread = (chat.unread || 0) + 1;
                AudioFX.playReceive();
            }

            saveContacts();
            renderChatList();
        }

        function renderChatList() {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            const filtered = state.chats.filter(c => c.username.toLowerCase().includes(state.searchQuery.toLowerCase()));

            document.getElementById('chat-count').innerText = `${state.chats.length} диалогов`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-500 text-xs">
                        <i class="fa-solid fa-comments text-3xl mb-2 block opacity-30"></i>
                        Нет диалогов. Нажмите "+" чтобы добавить человека.
                    </div>
                `;
                return;
            }

            filtered.forEach(chat => {
                const lastMsg = chat.messages[chat.messages.length - 1];
                const lastText = lastMsg ? (lastMsg.sender === state.currentUser.username ? `Вы: ${lastMsg.text}` : lastMsg.text) : 'Нет сообщений';
                const isActive = chat.username === state.activeChatUser;
                const initials = chat.username.substring(0, 1).toUpperCase();

                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl cursor-pointer transition flex items-center justify-between group active:scale-[0.99] ${
                    isActive ? 'bg-indigo-600/20 border border-indigo-500/30' : 'hover:bg-slate-800/60'
                }`;
                item.onclick = () => openChatWithUser(chat.username, chat.avatar);

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="relative flex-shrink-0">
                            <div class="w-11 h-11 rounded-full bg-gradient-to-tr ${chat.avatar || 'from-indigo-500 to-purple-500'} flex items-center justify-center font-bold text-white shadow-md">
                                ${initials}
                            </div>
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                        </div>
                        <div class="overflow-hidden">
                            <h4 class="font-bold text-slate-200 text-xs sm:text-sm truncate group-hover:text-white">${chat.username}</h4>
                            <p class="text-[11px] text-slate-400 truncate mt-0.5">${lastText}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end space-y-1 flex-shrink-0 ml-2">
                        <span class="text-[10px] text-slate-500">${lastMsg ? (lastMsg.timestamp || '') : ''}</span>
                        ${chat.unread > 0 ? `<span class="px-1.5 py-0.5 rounded-full bg-indigo-600 text-white text-[10px] font-bold">${chat.unread}</span>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderActiveChat() {
            if (!state.activeChatUser) return;

            const chat = state.chats.find(c => c.username === state.activeChatUser);
            if (!chat) return;

            document.getElementById('header-name').innerText = chat.username;
            document.getElementById('header-status-text').innerText = 'В сети';
            
            const initials = chat.username.substring(0, 1).toUpperCase();
            const avatarEl = document.getElementById('header-avatar');
            avatarEl.className = `w-10 h-10 rounded-full bg-gradient-to-tr ${chat.avatar || 'from-indigo-500 to-purple-500'} flex items-center justify-center font-bold text-white shadow-md`;
            avatarEl.innerText = initials;

            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            if (chat.messages.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex items-center justify-center text-slate-500 text-xs">
                        Начните разговор с ${chat.username}! 👋
                    </div>
                `;
                return;
            }

            chat.messages.forEach(msg => {
                const isMe = msg.sender === state.currentUser.username;
                const msgNode = document.createElement('div');
                msgNode.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fade-in`;

                msgNode.innerHTML = `
                    <div class="max-w-[85%] sm:max-w-[65%] rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm shadow-sm relative group ${
                        isMe 
                        ? 'bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-br-none' 
                        : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'
                    }">
                        <p class="leading-relaxed break-words">${msg.text}</p>
                        <div class="flex items-center justify-end space-x-1 mt-1 text-[9px] ${isMe ? 'text-indigo-200' : 'text-slate-400'}">
                            <span>${msg.timestamp || ''}</span>
                            ${isMe ? '<i class="fa-solid fa-check-double text-[10px]"></i>' : ''}
                        </div>
                    </div>
                `;
                container.appendChild(msgNode);
            });

            container.scrollTop = container.scrollHeight;
        }

        async function handleFindUser(e) {
            e.preventDefault();
            const input = document.getElementById('find-username-input');
            const targetUsername = input.value.trim();

            if (!targetUsername) return;

            if (targetUsername.toLowerCase() === state.currentUser.username.toLowerCase()) {
                showToast('Нельзя создать чат с самим собой', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/check_user/${encodeURIComponent(targetUsername)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.exists) {
                        openChatWithUser(data.user.username, data.user.avatar);
                        showToast(`Чат с ${data.user.username} открыт`, 'success');
                    }
                } else {
                    openChatWithUser(targetUsername, 'from-amber-500 to-orange-600');
                    showToast(`Чат с "${targetUsername}" создан!`, 'success');
                }
            } catch(e) {
                openChatWithUser(targetUsername, 'from-amber-500 to-orange-600');
            }
        }

        function openNewChatModal() {
            document.getElementById('modal-new-chat').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function filterChats() {
            state.searchQuery = document.getElementById('search-input').value;
            renderChatList();
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emoji-picker');
            picker.classList.toggle('hidden');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('message-input');
            input.value += emoji;
            toggleEmojiPicker();
            input.focus();
        }

        let localStream = null;
        let callTimerInterval = null;
        let callSeconds = 0;
        let isMicMuted = false;
        let isCamOff = false;

        async function startCall(type) {
            if (!state.activeChatUser) {
                showToast('Выберите собеседника для звонка', 'error');
                return;
            }

            const modal = document.getElementById('modal-call');
            const callName = document.getElementById('call-name');
            const callAvatar = document.getElementById('call-avatar');
            const callStatus = document.getElementById('call-status');
            const localVideo = document.getElementById('local-video');
            const localVideoContainer = document.getElementById('local-video-container');
            const remoteVideo = document.getElementById('remote-video');
            const remotePlaceholder = document.getElementById('remote-placeholder');
            const callTimer = document.getElementById('call-timer');

            callName.innerText = state.activeChatUser;
            callAvatar.innerText = state.activeChatUser.charAt(0).toUpperCase();
            callStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Подключение устройства...`;
            modal.classList.remove('hidden');

            isMicMuted = false;
            isCamOff = false;
            updateMediaButtonsUI();

            const isVideoCall = type === 'video';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: isVideoCall ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } : false,
                    audio: true
                });

                if (isVideoCall) {
                    localVideo.srcObject = localStream;
                    localVideoContainer.classList.remove('hidden');
                } else {
                    localVideoContainer.classList.add('hidden');
                }

                callStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 pulse-online"></span> Разговор (${type === 'video' ? 'Видео' : 'Аудио'})`;
                
                remoteVideo.srcObject = localStream;
                remoteVideo.classList.remove('hidden');
                remotePlaceholder.classList.add('hidden');

                callSeconds = 0;
                callTimer.innerText = '00:00';
                callTimer.classList.remove('hidden');
                clearInterval(callTimerInterval);
                callTimerInterval = setInterval(() => {
                    callSeconds++;
                    const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                    const secs = String(callSeconds % 60).padStart(2, '0');
                    callTimer.innerText = `${mins}:${secs}`;
                }, 1000);

                showToast(`Звонок начат`, 'success');

            } catch (err) {
                callStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500"></span> Нет доступа к камере/микрофону`;
                showToast('Не удалось получить доступ к камере или микрофону', 'error');
            }
        }

        function toggleMicrophone() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMicMuted = !isMicMuted;
                audioTrack.enabled = !isMicMuted;
                updateMediaButtonsUI();
            }
        }

        function toggleCamera() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                isCamOff = !isCamOff;
                videoTrack.enabled = !isCamOff;
                updateMediaButtonsUI();
            }
        }

        function updateMediaButtonsUI() {
            const micBtn = document.getElementById('btn-toggle-mic');
            const micIcon = document.getElementById('mic-icon');
            const camBtn = document.getElementById('btn-toggle-cam');
            const camIcon = document.getElementById('cam-icon');

            if (isMicMuted) {
                micBtn.className = 'w-12 h-12 rounded-2xl bg-red-600 text-white flex items-center justify-center shadow-lg transition';
                micIcon.className = 'fa-solid fa-microphone-slash text-base';
            } else {
                micBtn.className = 'w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition';
                micIcon.className = 'fa-solid fa-microphone text-base';
            }

            if (isCamOff) {
                camBtn.className = 'w-12 h-12 rounded-2xl bg-red-600 text-white flex items-center justify-center shadow-lg transition';
                camIcon.className = 'fa-solid fa-video-slash text-base';
            } else {
                camBtn.className = 'w-12 h-12 rounded-2xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center shadow-lg transition';
                camIcon.className = 'fa-solid fa-video text-base';
            }
        }

        function endCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            clearInterval(callTimerInterval);
            document.getElementById('call-timer').classList.add('hidden');
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('remote-video').classList.add('hidden');
            document.getElementById('remote-placeholder').classList.remove('hidden');
            document.getElementById('modal-call').classList.add('hidden');

            showToast('Звонок завершен', 'info');
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold text-white flex items-center space-x-2 animate-fade-in pointer-events-auto ${
                type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-indigo-600'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        window.onload = function() {
            const savedUser = localStorage.getItem('nexus_user');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    onAuthSuccess(user);
                } catch(e) {
                    document.getElementById('auth-overlay').classList.remove('hidden');
                }
            } else {
                document.getElementById('auth-overlay').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
