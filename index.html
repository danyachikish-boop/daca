<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Flask P2P Messenger</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
    input, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; font-size: 14px; }
    input[type="text"] { width: calc(100% - 22px); background: #2a2a2a; color: #fff; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    #chat { height: 300px; border: 1px solid #333; overflow-y: auto; padding: 10px; margin: 10px 0; background: #252525; }
    .msg { margin-bottom: 8px; }
    .msg.system { color: #888; font-style: italic; }
  </style>
</head>
<body>

<div class="container">
  <h2>Flask P2P Мессенджер</h2>
  
  <div>
    <input type="text" id="myId" placeholder="Ваш ID">
    <button onclick="register()">Войти</button>
  </div>

  <hr style="border-color: #333;">

  <div>
    <input type="text" id="targetId" placeholder="ID собеседника">
  </div>

  <div id="chat"></div>

  <div>
    <input type="text" id="textMsg" placeholder="Введите сообщение...">
    <button onclick="sendText()">Отправить текст</button>
  </div>

  <div style="margin-top: 10px;">
    <input type="file" id="fileInput">
    <button onclick="sendFile()">Отправить файл (P2P)</button>
  </div>
</div>

<script>
  // Подключение к Flask-серверу на порту 5001
  const socket = io("http://localhost:5001");
  let myUserId = "";
  let peerConnection = null;
  let dataChannel = null;
  let fileBuffer = [];
  let fileName = "";

  const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  function log(msg, type = "") {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = msg;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function register() {
    myUserId = document.getElementById("myId").value.trim();
    if (!myUserId) return alert("Введите Ваш ID");
    socket.emit("register", myUserId);
    log(`Вы вошли как: ${myUserId}`, "system");
  }

  // --- Текстовые сообщения ---
  function sendText() {
    const targetId = document.getElementById("targetId").value.trim();
    const text = document.getElementById("textMsg").value.trim();
    if (!targetId || !text) return;

    socket.emit("send_text", { sender_id: myUserId, target_id: targetId, text: text });
    log(`Я -> ${targetId}: ${text}`);
    document.getElementById("textMsg").value = "";
  }

  socket.on("receive_text", (data) => {
    log(`${data.sender_id}: ${data.text}`);
  });

  // --- P2P Передача файлов (WebRTC) ---
  function createPeerConnection(targetId) {
    peerConnection = new RTCPeerConnection(config);

    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        socket.emit("signal", { sender_id: myUserId, target_id: targetId, signal: { candidate: event.candidate } });
      }
    };

    peerConnection.ondatachannel = (event) => {
      const channel = event.channel;
      setupChannelEvents(channel);
    };
  }

  function setupChannelEvents(channel) {
    channel.onopen = () => log("P2P Соединение установлено!", "system");
    channel.onmessage = (e) => {
      if (typeof e.data === "string") {
        const meta = JSON.parse(e.data);
        if (meta.type === "file-start") {
          fileName = meta.name;
          fileBuffer = [];
          log(`Получение файла: ${fileName}...`, "system");
        }
      } else {
        fileBuffer.push(e.data);
      }
    };
    channel.onclose = () => {
      if (fileBuffer.length > 0) {
        const blob = new Blob(fileBuffer);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        log(`Файл ${fileName} успешно сохранён на диск!`, "system");
        fileBuffer = [];
      }
    };
  }

  async function sendFile() {
    const targetId = document.getElementById("targetId").value.trim();
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!targetId || !file) return alert("Укажите ID и выберите файл");

    createPeerConnection(targetId);
    dataChannel = peerConnection.createDataChannel("fileTransfer");
    setupChannelEvents(dataChannel);

    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);
    socket.emit("signal", { sender_id: myUserId, target_id: targetId, signal: { sdp: offer } });

    dataChannel.onopen = async () => {
      log(`Отправка файла ${file.name}...`, "system");
      dataChannel.send(JSON.stringify({ type: "file-start", name: file.name }));

      const arrayBuffer = await file.arrayBuffer();
      const chunkSize = 16384; // 16KB
      for (let i = 0; i < arrayBuffer.byteLength; i += chunkSize) {
        dataChannel.send(arrayBuffer.slice(i, i + chunkSize));
      }
      setTimeout(() => dataChannel.close(), 1000);
    };
  }

  socket.on("signal", async (data) => {
    const targetId = data.sender_id;
    if (!peerConnection) createPeerConnection(targetId);

    if (data.signal.sdp) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal.sdp));
      if (data.signal.sdp.type === "offer") {
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit("signal", { sender_id: myUserId, target_id: targetId, signal: { sdp: answer } });
      }
    } else if (data.signal.candidate) {
      await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
    }
  });
</script>

</body>
</html>
